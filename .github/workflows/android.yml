name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore signing key
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEY_B64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/trabi-racing.jks"
          keytool -list -keystore "$RUNNER_TEMP/trabi-racing.jks" -storepass "$KEY_PASS" -alias "$KEY_ALIAS" > /dev/null
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/trabi-racing.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Trabi-Racing-APK
          path: app/build/outputs/apk/release/*.apk
