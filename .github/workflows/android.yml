name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK prüfen
        run: |
          test -d "$ANDROID_HOME" || { echo '::error::Android SDK fehlt auf dem Runner'; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signaturschlüssel prüfen
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEY_B64" || { echo "::error::ANDROID_KEYSTORE_BASE64 fehlt"; exit 1; }
          test -n "$KEY_PASS" || { echo "::error::ANDROID_KEYSTORE_PASSWORD fehlt"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::ANDROID_KEY_ALIAS fehlt"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::ANDROID_KEY_PASSWORD fehlt"; exit 1; }
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/trabi-racing.jks"
          keytool -list -keystore "$RUNNER_TEMP/trabi-racing.jks" -storepass "$KEY_PASS" -alias "$KEY_ALIAS" >/dev/null

      - name: Signierte APK bauen
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/trabi-racing.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: APK für Download vorbereiten
        id: apk
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Trabi-Racing.apk
          echo "changes=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"

      - name: Als GitHub Release bereitstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Trabi Racing 1.0.0 (Build ${{ github.run_number }})
          body: |
            Version 1.0.0, Build ${{ github.run_number }}.

            Änderungen in diesem Build:
            ${{ steps.apk.outputs.changes }}

            Unter Assets auf Trabi-Racing.apk tippen.
          files: out/Trabi-Racing.apk

      - name: Auch als Actions-Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: Trabi-Racing-APK
          path: out/Trabi-Racing.apk
