plugins { id 'com.android.application' }
android {
    namespace 'de.protech1982.trabiracing'
    compileSdk 35
    defaultConfig {
        applicationId 'de.protech1982.trabiracing'
        minSdk 24
        targetSdk 35
        versionCode (System.getenv('APP_VERSION_CODE') ?: '1') as Integer
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            def storeFilePath = System.getenv('ANDROID_KEYSTORE_FILE')
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }
}
