<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b20;color:#fff;font-family:Arial,sans-serif}canvas{position:absolute;width:100%;height:100%;touch-action:none}#ui{position:absolute;inset:0;pointer-events:none}button,select{font:inherit}button{border:1px solid #33e6f9;border-radius:14px;background:#07152ddc;color:#fff;padding:13px 16px;box-shadow:0 0 12px #14c8f988}button:active{background:#14627b}#hud{position:absolute;top:14px;left:14px;right:14px;display:none;justify-content:space-between;align-items:flex-start}#hud button{pointer-events:auto;font-size:23px;padding:8px 13px}#stats{text-align:right;text-shadow:0 2px 5px #000;font-weight:bold;font-size:17px;line-height:1.6}#arrows{position:absolute;bottom:24px;left:20px;right:20px;display:none;justify-content:space-between}#arrows button{pointer-events:auto;font-size:35px;width:83px;height:76px}#panel{position:absolute;inset:0;background:linear-gradient(#0a1035df,#10051ee9);display:flex;align-items:center;justify-content:center;pointer-events:auto;overflow:auto;padding:20px}#card{width:min(100%,370px);padding:20px;background:#070e27e8;border:1px solid #ef48c8;border-radius:18px;box-shadow:0 0 28px #d32e9b88;text-align:center}h1{font-style:italic;color:#ff769f;text-shadow:0 0 16px #fc267e;font-size:37px;margin:4px 0 16px}h2{color:#69efff}#card button{display:block;width:100%;margin:9px 0}#card label{display:block;margin:12px 0}select{background:#07152d;color:white;padding:9px;border-radius:8px;border:1px solid #41dbe9}small{color:#bed5e5}#message{white-space:pre-line;font-size:14px;color:#c7efff}#ranking{max-height:200px;overflow:auto;text-align:left;font-size:14px}#ranking div{padding:5px;border-bottom:1px solid #445}</style></head><body><canvas id="game"></canvas><div id="ui"><div id="hud"><button id="gear" aria-label="Einstellungen">⚙</button><div id="stats">Punkte: <span id="score">0</span><br>Zeit: <span id="time">0:00</span><br>Strecke: <span id="distance">0</span> m</div></div><div id="arrows"><button id="left" aria-label="Links">◀</button><button id="right" aria-label="Rechts">▶</button></div><div id="panel"><div id="card"><h1>Trabi Racing</h1><div id="message">DDR-Neon-Racer</div><div id="controls"><label>Zeitlimit: <select id="duration"><option value="60">1 Minute</option><option value="120" selected>2 Minuten</option><option value="300">5 Minuten</option></select></label><button id="start">▶ Spiel starten</button><button id="resume" hidden>Weiterfahren</button><button id="save">💾 Spiel speichern</button><button id="load">📂 Spiel laden</button><button id="clear">🗑 Spielstand löschen</button><button id="scores">🏆 Highscore Top 10</button><button id="music">♫ Musik: An</button><button id="updates">↻ Nach Updates suchen</button><button id="home" hidden>Hauptmenü</button><div id="ranking" hidden></div></div></div></div></div><script>
'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d'),$=id=>document.getElementById(id),repo='ProTech1982/Trabi-Racing';
let W=0,H=0,mode='menu',lane=1,obstacles=[],score=0,elapsed=0,meters=0,spawn=0,last=0,roadScroll=0,music=localStorage.getItem('trabiMusic')!=='off',audio=null,beat=0,duration=120;
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function resize(){W=innerWidth;H=innerHeight;c.width=Math.round(W*devicePixelRatio);c.height=Math.round(H*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
function poly(points,fill){ctx.fillStyle=fill;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill()}
function linePath(points,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke()}
function gradient(x,y,w,h,a,b){let g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,a);g.addColorStop(1,b);ctx.fillStyle=g;ctx.fillRect(x,y,w,h)}
function road(y){let t=clamp((y-H*.32)/(H*.72),0,1),half=W*(.11+.61*t);return {left:W/2-half,right:W/2+half,half,t}}
function laneX(l,y){let r=road(y);return r.left+(l+.5)*(r.right-r.left)/3}
function drawBackdrop(){
 gradient(0,0,W,H,'#180a46','#f54c8c');let horizon=H*.32;
 ctx.fillStyle='#111331';for(let i=0;i<25;i++){let x=i*W/24-8,w=rndSeed(i)*W*.09+12,h=(.08+rndSeed(i+40)*.18)*H;ctx.fillRect(x,horizon-h,w,h);ctx.fillStyle='#32c9f9';for(let j=0;j<4;j++)ctx.fillRect(x+5+j*9,horizon-h+14,3,3);ctx.fillStyle='#111331'}
 ctx.fillStyle='#fc9e9e';ctx.beginPath();ctx.arc(W*.7,H*.19,W*.09,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#091225';ctx.fillRect(0,horizon,W,H-horizon);
 poly([[W*.39,horizon],[W*.61,horizon],[W*1.13,H],[-W*.13,H]],'#1c243d');
 for(let j=0;j<3;j++){let a=j/3,b=(j+1)/3;const p=y=>road(y).left+(road(y).right-road(y).left)*a;linePath([[p(horizon),horizon],[p(H),H]],'#3b2c60',1)}
 for(let k=1;k<=2;k++){for(let i=0;i<11;i++){let t=((i/11+roadScroll)%1),y=horizon+(t*t)*(H-horizon),r=road(y),x=r.left+(r.right-r.left)*k/3;ctx.fillStyle='#d6e5fa';ctx.fillRect(x-1.5,y,3,2+t*27)}}
 for(let side of [-1,1]){for(let i=0;i<9;i++){let t=((i/9+roadScroll*.45)%1),y=horizon+t*t*(H-horizon),r=road(y),x=W/2+side*(r.half+7+15*t);ctx.strokeStyle=side===1?'#ff4da5':'#45dfff';ctx.lineWidth=1+3*t;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+side*12*t,y+26*t);ctx.stroke()}}
}
function rndSeed(n){let x=Math.sin(n*127.1+12.7)*43758.5453;return x-Math.floor(x)}
function drawBarrier(o){let y=H*.32+o.z*o.z*(H*.68),x=laneX(o.lane,y),size=10+o.z*W*.21;ctx.save();ctx.translate(x,y);ctx.fillStyle='#0d1429';ctx.fillRect(-size*.53,-size*.4,size*1.06,size*.7);ctx.fillStyle='#e9e7df';ctx.fillRect(-size*.5,-size*.5,size,size*.5);ctx.beginPath();ctx.rect(-size*.5,-size*.5,size,size*.5);ctx.clip();ctx.strokeStyle='#ed3d47';ctx.lineWidth=size*.19;for(let i=-3;i<4;i++){ctx.beginPath();ctx.moveTo(i*size*.33,-size*.5);ctx.lineTo((i+1.2)*size*.33,0);ctx.stroke()}ctx.restore();ctx.fillStyle='#ffc448';ctx.beginPath();ctx.arc(x,y-size*.65,3+o.z*6,0,Math.PI*2);ctx.fill()}
function drawTrabi(){
 const y=H*.79,x=laneX(lane,y),w=Math.min(W*.30,150),h=w*.92;
 ctx.save();ctx.translate(x,y);ctx.shadowColor='#ff317f';ctx.shadowBlur=24;ctx.fillStyle='#fc317e';ctx.fillRect(-w*.42,h*.42,w*.84,5);ctx.shadowBlur=0;
 poly([[-w*.42,h*.32],[-w*.45,-h*.20],[-w*.32,-h*.44],[w*.32,-h*.44],[w*.45,-h*.20],[w*.42,h*.32]],'#8bcbe4');
 poly([[-w*.30,-h*.40],[w*.30,-h*.40],[w*.36,-h*.05],[-w*.36,-h*.05]],'#1c344d');
 ctx.fillStyle='#a2d8e9';ctx.fillRect(-w*.46,-h*.03,w*.92,h*.33);
 ctx.fillStyle='#4b89a8';ctx.fillRect(-w*.39,h*.19,w*.78,h*.13);
 ctx.fillStyle='#e7444b';ctx.fillRect(-w*.46,h*.11,w*.11,h*.20);ctx.fillRect(w*.35,h*.11,w*.11,h*.20);
 ctx.fillStyle='#e7f1f4';ctx.fillRect(-w*.24,h*.18,w*.48,h*.16);ctx.fillStyle='#17253a';ctx.font='bold '+Math.round(w*.12)+'px Arial';ctx.textAlign='center';ctx.fillText('TR 601',0,h*.30);
 ctx.fillStyle='#0b111b';ctx.fillRect(-w*.51,h*.13,w*.08,h*.28);ctx.fillRect(w*.43,h*.13,w*.08,h*.28);ctx.fillStyle='#9da8b0';ctx.fillRect(-w*.49,h*.36,w*.98,h*.09);ctx.restore()
}
function render(){drawBackdrop();obstacles.slice().sort((a,b)=>a.z-b.z).forEach(drawBarrier);drawTrabi()}
function showPanel(text,paused=false){mode=paused?'pause':'menu';$('panel').style.display='flex';$('hud').style.display=paused?'flex':'none';$('arrows').style.display='none';$('resume').hidden=!paused;$('home').hidden=!paused;$('message').textContent=text;$('ranking').hidden=true}
function startGame(){duration=Number($('duration').value);elapsed=0;meters=0;score=0;spawn=0;roadScroll=0;lane=1;obstacles=[];resume()}
function resume(){mode='play';$('panel').style.display='none';$('hud').style.display='flex';$('arrows').style.display='flex';startAudio()}
function pause(){if(mode==='play'){mode='pause';showPanel('Pausiert',true)}}
function endGame(crash){mode='over';let scores=JSON.parse(localStorage.getItem('trabiScores')||'[]');scores.push({score:Math.floor(score),date:new Date().toLocaleDateString('de-DE')});scores.sort((a,b)=>b.score-a.score);localStorage.setItem('trabiScores',JSON.stringify(scores.slice(0,10)));showPanel(crash?'Unfall! '+Math.floor(score)+' Punkte':'Zeit geschafft! '+Math.floor(score)+' Punkte')}
function move(d){if(mode==='play')lane=clamp(lane+d,0,2)}
function tick(now){let dt=last?Math.min(.05,(now-last)/1000):0;last=now;if(mode==='play'){elapsed+=dt;meters+=dt*18;score+=dt*100;roadScroll=(roadScroll+dt*.36)%1;spawn-=dt;if(spawn<=0){let l=Math.floor(Math.random()*3);obstacles.push({lane:l,z:0,hit:false});spawn=rnd(.72,1.25)}for(const o of obstacles){o.z+=dt*.49;if(!o.hit&&o.z>.82&&o.z<1.03&&o.lane===lane){o.hit=true;endGame(true);break}}obstacles=obstacles.filter(o=>o.z<1.22);$('score').textContent=Math.floor(score).toLocaleString('de-DE');$('time').textContent=Math.floor(elapsed/60)+':'+String(Math.floor(elapsed%60)).padStart(2,'0')+' / '+Math.floor(duration/60)+':00';$('distance').textContent=Math.floor(meters);if(elapsed>=duration)endGame(false);musicTick(dt)}render();requestAnimationFrame(tick)}requestAnimationFrame(tick);
function save(){localStorage.setItem('trabiSave',JSON.stringify({duration,elapsed,meters,score,lane,spawn,roadScroll,obstacles}));$('message').textContent='Spielstand lokal gespeichert.'}
function load(){try{let v=JSON.parse(localStorage.getItem('trabiSave'));if(!v)throw Error();duration=v.duration;elapsed=v.elapsed;meters=v.meters;score=v.score;lane=v.lane;spawn=v.spawn;roadScroll=v.roadScroll;obstacles=v.obstacles;$('duration').value=String(duration);resume()}catch(e){$('message').textContent='Kein gültiger Spielstand vorhanden.'}}
function startAudio(){if(!music)return;try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}}
function musicTick(dt){if(!music||!audio)return;beat-=dt;if(beat>0)return;beat=.19;let osc=audio.createOscillator(),gain=audio.createGain();osc.type='square';let notes=[220,277,330,440,330,277,196,247];osc.frequency.value=notes[Math.floor(elapsed/.19)%notes.length];gain.gain.setValueAtTime(.025,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.14);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+.15)}
$('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);$('gear').onclick=pause;$('start').onclick=startGame;$('resume').onclick=resume;$('save').onclick=save;$('load').onclick=load;$('clear').onclick=()=>{localStorage.removeItem('trabiSave');$('message').textContent='Lokaler Spielstand gelöscht.'};$('home').onclick=()=>showPanel('Hauptmenü');$('music').onclick=()=>{music=!music;localStorage.setItem('trabiMusic',music?'on':'off');$('music').textContent='♫ Musik: '+(music?'An':'Aus');if(music)startAudio()};$('music').textContent='♫ Musik: '+(music?'An':'Aus');$('scores').onclick=()=>{let a=JSON.parse(localStorage.getItem('trabiScores')||'[]');$('ranking').hidden=false;$('ranking').innerHTML=a.length?a.map((s,i)=>'<div>'+(i+1)+'. '+s.score.toLocaleString('de-DE')+' Punkte · '+s.date+'</div>').join(''):'Noch keine Highscores';};
$('updates').onclick=async()=>{let m=$('message');m.textContent='Prüfe Updates…';try{let res=await fetch('https://api.github.com/repos/'+repo+'/releases/latest',{headers:{Accept:'application/vnd.github+json'}});if(!res.ok)throw Error('Release nicht öffentlich erreichbar ('+res.status+')');let data=await res.json(),latest=(data.tag_name||'').replace(/^v/,'');if(!latest)throw Error('Keine Version');let current='1.0.0',parse=v=>v.split('.').map(x=>parseInt(x,10)||0),a=parse(latest),b=parse(current),newer=a.some((n,i)=>n>b[i]&&a.slice(0,i).every((p,j)=>p===b[j]));if(newer){m.textContent='Update '+latest+' verfügbar.\n'+(data.body||'Änderungen im Release ansehen.').slice(0,240);if(confirm('Update '+latest+' im Browser öffnen?'))location.href=data.html_url}else m.textContent='Aktuellste Version ('+current+').'}catch(e){m.textContent='Updateprüfung nicht möglich: '+e.message+'\nBei privatem Repository sind öffentliche Releases nicht anonym abrufbar.'}};
window.trabiBack=()=>{if(mode==='play')pause();else if(mode==='pause')resume();else showPanel('Hauptmenü')};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='Escape')window.trabiBack()});
</script></body></html>
